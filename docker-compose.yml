services:
  # ==============================================================================
  # Database Service: MySQL 8.0 (Tùy chọn - chỉ chạy khi bật profile "local-db")
  # Mặc định hệ thống kết nối tới MySQL server dùng chung tại 10.216.1.218.
  # Nếu muốn chạy MySQL riêng cục bộ trên container, chạy:
  #   docker compose --profile local-db up -d
  # và đặt DB_HOST=mysql trong file .env
  # ==============================================================================
  mysql:
    image: mysql:8.0
    container_name: routine-mysql
    profiles: ["local-db"]
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-routine_db}
      MYSQL_USER: ${DB_USER:-sanrockk}
      MYSQL_PASSWORD: ${DB_PASSWORD:-1}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - routine_net

  # ==============================================================================
  # Backend Service: Spring Boot 3 + Java 17
  # Image được build tự động và lưu trên GitHub Packages (ghcr.io)
  # Kết nối tới MySQL qua biến DB_HOST (mặc định 10.216.1.218)
  # ==============================================================================
  backend:
    image: ghcr.io/sanrockk2995/routine-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: routine-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: ${DB_HOST:-10.216.1.218}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-routine_db}
      DB_USER: ${DB_USER:-sanrockk}
      DB_PASSWORD: ${DB_PASSWORD:-1}
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-RoutineSuperSecretKeyForGraduationProjectChangeMeInProduction20242025ABCDEF}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/v3/api-docs || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - routine_net

  # ==============================================================================
  # Frontend Service: ReactJS + Nginx Alpine (Reverse Proxy /api/ -> Backend)
  # Image được build tự động và lưu trên GitHub Packages (ghcr.io)
  # ==============================================================================
  frontend:
    image: ghcr.io/sanrockk2995/routine-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: routine-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - routine_net

# ==============================================================================
# Persistent Volumes & Networks
# ==============================================================================
volumes:
  mysql_data:
    name: routine_mysql_data

networks:
  routine_net:
    name: routine_network
    driver: bridge
